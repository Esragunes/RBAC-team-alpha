apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: team-alpha-dev
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: registry.access.redhat.com/ubi9/nginx-124
        command: ["nginx", "-g", "daemon off;"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: content
          mountPath: /opt/app-root/src/index.html
          subPath: index.html
          readOnly: true
      volumes:
      - name: content
        configMap:
          name: web-content
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: team-alpha-dev
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 8080
    targetPort: 8080
